name: Fork / Deploy OpenProject pilot via SSM

"on":
  workflow_dispatch:
    inputs:
      image_digest:
        description: "GHCR image digest (sha256:...); approved build only"
        required: true
        type: string
      dry_run:
        description: "Validation only. No AWS modifications."
        required: true
        type: boolean
        default: true
      confirmation:
        description: "For real deploy, enter DEPLOY_NO_MIGRATIONS after schema review"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: openproject-pilot-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'aristha/openproject' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: pilot
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_IMAGE: ghcr.io/aristha/openproject${{@ inputs.image_digest }}
      INSTANCE_ID: ${{@ vars.EC2_INSTANCE_ID }}
      BACKUP_BUCKET: ${{@ vars.S3_BACKUP_BUCKET }}
    steps:
      - name: Checkout code (read only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate input and deployment script (offline)
        shell: bash
        run: |
          set -euo pipefail
          test "${{@ inputs.dry_run }}" = "true" || test "${{@ inputs.confirmation }}" = "DEPLOY_NO_MIGRATIONS"
          python3 -m py_compile .github/scripts/deploy_openproject_ssm.py
          bash -n .github/scripts/openproject-remote-deploy.sh
          python3 .github/scripts/deploy_openproject_ssm.py \
            --instance-id "i-0e813ed245633d925" \
            --bucket "betasoft-openproject-backups-080891697921-ap-southeast-2-an" \
            --image "$DEPLOY_IMAGE" --dry-run

      - name: Require environment variables for real deploy
        if: inputs.dry_run == false
        shell: bash
        run: |
          set -euo pipefail
          test -n "$INSTANCE_ID" && test -n "$BACKUP_BUCKET"
          test -n "${{@ vars.AWS_DEPLOY_ROLE_ARN }}"

      - name: Acquire temporary AWS credentials with OIDC
        if: inputs.dry_run == false
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ap-southeast-2
          role-to-assume: ${{@ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: betasoft-deploy-${{@ github.run_id }}

      - name: Deploy using AWS SSM (backup, health check, image rollback)
        if: inputs.dry_run == false
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/deploy_openproject_ssm.py \
            --instance-id "$INSTANCE_ID" \
            --bucket "$BACKUP_BUCKET" \
            --image "$DEPLOY_IMAGE"
